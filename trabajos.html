<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Trabajos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container">

    <a class="navbar-brand" href="index.html" id="navbar-nombre">Bienvenido</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      ☰
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link nav-link-white" href="index.html">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-link-white" href="index.html#sobre-mi">Sobre mí</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-link-white" href="trabajos.html">Ver trabajos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-link-white" href="login.html" id="btn-auth">Iniciar sesión</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container my-5 pt-5">
  <section id="trabajos">

    <div class="header-trabajos text-center text-white mb-4">
      <h1>Mis Trabajos</h1>
    </div>

    <!-- UNIDAD 1 -->
    <div class="unidad mb-4">
      <h3>Unidad 1</h3>
      <div class="row" id="unidad-1">
      </div>
    </div>

    <!-- UNIDAD 2 -->
    <div class="unidad mb-4">
      <h3>Unidad 2</h3>
      <div class="row" id="unidad-2"></div>
    </div>

    <!-- UNIDAD 3 -->
    <div class="unidad mb-4">
      <h3>Unidad 3</h3>
      <div class="row" id="unidad-3"></div>
    </div>

    <!-- UNIDAD 4 -->
    <div class="unidad mb-4">
      <h3>Unidad 4</h3>
      <div class="row" id="unidad-4"></div>
    </div>

  </section>
</div>

<!-- PANEL ADMIN -->
<div id="panel-admin" class="container my-4" style="display:none;">
  <div class="card p-4 shadow">
    <h4 class="mb-3">Panel Administrador</h4>
    <input type="text" id="titulo-semana" class="form-control my-2" placeholder="Ej: Semana 2">
    <input type="text" id="descripcion-semana" class="form-control my-2" placeholder="Descripción breve">
    <input type="file" id="archivo-semana" class="form-control my-2">
    <select id="unidad-semana" class="form-control my-2">
      <option value="1">Unidad 1</option>
      <option value="2">Unidad 2</option>
      <option value="3">Unidad 3</option>
      <option value="4">Unidad 4</option>
    </select>
    <!-- ✅ onclick conectado -->
    <button id="btn-agregar" type="button" class="btn btn-success mt-2" onclick="agregarSemana()">
      Agregar Semana
    </button>
  </div>
</div>

<!-- MODAL EDITAR -->
<div id="modal-editar" class="modal-custom" style="display:none;">
  <div class="modal-content">
    <span class="cerrar" onclick="cerrarEditar()">&times;</span>
    <h4>Editar Semana</h4>
    <input type="text" id="edit-titulo" class="form-control my-2" placeholder="Título">
    <input type="text" id="edit-descripcion" class="form-control my-2" placeholder="Descripción">
    <input type="file" id="edit-archivo" class="form-control my-2">
    <button class="btn btn-success mt-2" onclick="guardarEdicion()">Guardar cambios</button>
  </div>
</div>

<!-- Scripts al final, en orden correcto -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/scripts.js"></script>

</body>
</html>
